<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Planning Dashboard</title>
    <!-- Bootstrap CSS for modern, responsive design -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Optional: Bootstrap Icons for navigation -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
/* Hide any stray blue square or unwanted nav-pills indicator */
.nav-pills + .nav-item, .nav-pills > .nav-item:empty {
    display: none !important;
}

        /* Custom styles for cards, spacing, and floating button */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .filter-bar {
            margin-bottom: 1rem;
        }
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 999;
        }
        .nav-link.active {
            font-weight: bold;
            color: #fff !important;
            background-color: #0d6efd !important;
            border-radius: 0.5rem;
            border-bottom: none;
            box-shadow: 0 2px 8px rgba(13,110,253,0.10);
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="{{ url_for('expenses_tab') }}">Financial Planning Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'expenses' %}active{% endif %}" href="{{ url_for('expenses_tab') }}">
                            <i class="bi bi-credit-card"></i> Expenses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'income' %}active{% endif %}" href="{{ url_for('income_tab') }}">
                            <i class="bi bi-cash-coin"></i> Income
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'investments' %}active{% endif %}" href="{{ url_for('investments_tab') }}">
                            <i class="bi bi-piggy-bank"></i> Investments
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'analytics' %}active{% endif %}" href="{{ url_for('analytics') }}">
                            <i class="bi bi-bar-chart"></i> Analytics
                        </a>
                    </li>
                    <li class="nav-item ms-3">
                        <button type="button" class="btn btn-link p-0" style="font-size: 1.4rem;" data-bs-toggle="modal" data-bs-target="#settingsModal" title="Settings">
                            <i class="bi bi-gear"></i>
                        </button>
                    </li>
                </ul>
            </div>
    </nav>

    <!-- Main Content Block -->
    <div class="container mb-5">
        <title>{% block title %}Family Expense Tracker{% endblock %}</title>
        {% block content %}{% endblock %}
    </div>

    <!-- Settings Modal Include -->
    {% include 'settings_modal.html' %}

    <!-- Bootstrap JS (for dropdowns, navbar, etc.) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
